name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/web test
      - run: pnpm -C apps/web exec playwright install chromium
      - run: pnpm -C apps/web test:e2e

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - run: ruff check apps/api
      - run: ruff format --check apps/api
      - run: pytest -q apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          OPENROUTER_API_KEY: test-key
          JWT_SECRET: test-secret-for-ci

  api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - run: pip-audit -r apps/api/requirements.txt
      - run: bandit -r apps/api/app -ll -q
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
